[package]
name = "mcpd"
version = "0.1.0"
edition = "2021"
description = "MCP daemon for ACOS — registers and serves the mcp: scheme on Redox OS"

[features]
default = []
# Redox features are only enabled during cross-compilation inside the Podman build.
redox = ["mcp-scheme/redox"]
# WS1.M5 production gate: when this feature is active, the daemon refuses to
# start on `Skipped` / `Failed` boot-gate outcomes. Without it, the daemon
# warns and proceeds (development mode).
production = []

[dependencies]
mcp-scheme = { path = "mcp_scheme", default-features = false }
mcpd-authority-shim = { path = "mcpd-authority-shim" }
mcpd-observability = { path = "mcpd-observability" }
serde_json = "1"
libc = "0.2"

# Redox-only dependencies — resolved only when targeting Redox (cross-compile env)
[target.'cfg(target_os = "redox")'.dependencies]
redox-scheme = "0.11"
daemon = { path = "../base/recipes/core/base/source/daemon" }
libredox = "0.1"

[workspace]
resolver = "2"
members = [
    ".",
    "acos-authority-types",
    "acos-system-capabilities",
    "guardian-authority",
    "llm-runtime-api",
    "mcp-bridge",
    "mcp-fabric",
    "mcp_scheme",
    "mcpd-authority-shim",
    "mcpd-observability",
]
